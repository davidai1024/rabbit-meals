<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" role="img" aria-label="两人协作8步流程，以及菜单修改、重新确认与制作锁定规则。"><title>两人协作8步流程，以及菜单修改、重新确认与制作锁定规则。</title><g font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif"><rect x="0" y="0" width="1600" height="1050" rx="32" fill="#fff9ef" stroke="none" stroke-width="1"/><text x="72" y="82" font-size="42" font-weight="650" fill="#3f3d35" text-anchor="start">两个人的饭桌，怎样运转？</text><text x="72" y="124" font-size="22" font-weight="400" fill="#77786a" text-anchor="start">8 个步骤串起一餐，从加入到下一次期待</text><rect x="72" y="180" width="332" height="228" rx="24" fill="#fffefa" stroke="#e7e4d8" stroke-width="1.5"/><circle cx="108" cy="219" r="19" fill="#728368" stroke="none" stroke-width="1"/><text x="108" y="226" font-size="19" font-weight="650" fill="#fff" text-anchor="middle">1</text><text x="140" y="227" font-size="25" font-weight="600" fill="#3f3d35" text-anchor="start">创建饭桌</text><text x="98" y="289" font-size="19" font-weight="500" fill="#728368" text-anchor="start">任意一位成员</text><text x="98" y="335" font-size="17" font-weight="400" fill="#77786a" text-anchor="start">建立自己的共享空间</text><path d="M98 365H376" fill="none" stroke="#e7e4d8" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="98" y="390" font-size="15" font-weight="400" fill="#77786a" text-anchor="start">云端共享 · 由当前微信身份操作</text><path d="M416 292H435M428 285L435 292L428 299" fill="none" stroke="#728368" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="447" y="180" width="332" height="228" rx="24" fill="#fffefa" stroke="#e7e4d8" stroke-width="1.5"/><circle cx="483" cy="219" r="19" fill="#728368" stroke="none" stroke-width="1"/><text x="483" y="226" font-size="19" font-weight="650" fill="#fff" text-anchor="middle">2</text><text x="515" y="227" font-size="25" font-weight="600" fill="#3f3d35" text-anchor="start">邀请加入</text><text x="473" y="289" font-size="19" font-weight="500" fill="#728368" text-anchor="start">另一位成员</text><text x="473" y="335" font-size="17" font-weight="400" fill="#77786a" text-anchor="start">输入邀请码，最多两人</text><path d="M473 365H751" fill="none" stroke="#e7e4d8" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="473" y="390" font-size="15" font-weight="400" fill="#77786a" text-anchor="start">云端共享 · 由当前微信身份操作</text><path d="M791 292H810M803 285L810 292L803 299" fill="none" stroke="#728368" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="822" y="180" width="332" height="228" rx="24" fill="#fffefa" stroke="#e7e4d8" stroke-width="1.5"/><circle cx="858" cy="219" r="19" fill="#cf4f3c" stroke="none" stroke-width="1"/><text x="858" y="226" font-size="19" font-weight="650" fill="#fff" text-anchor="middle">3</text><text x="890" y="227" font-size="25" font-weight="600" fill="#3f3d35" text-anchor="start">挑选菜品</text><text x="848" y="289" font-size="19" font-weight="500" fill="#cf4f3c" text-anchor="start">点餐者</text><text x="848" y="335" font-size="17" font-weight="400" fill="#77786a" text-anchor="start">下周菜单 3 荤 + 3 素</text><path d="M848 365H1126" fill="none" stroke="#e7e4d8" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="848" y="390" font-size="15" font-weight="400" fill="#77786a" text-anchor="start">云端共享 · 由当前微信身份操作</text><path d="M1166 292H1185M1178 285L1185 292L1178 299" fill="none" stroke="#728368" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="1197" y="180" width="332" height="228" rx="24" fill="#fffefa" stroke="#e7e4d8" stroke-width="1.5"/><circle cx="1233" cy="219" r="19" fill="#cf4f3c" stroke="none" stroke-width="1"/><text x="1233" y="226" font-size="19" font-weight="650" fill="#fff" text-anchor="middle">4</text><text x="1265" y="227" font-size="25" font-weight="600" fill="#3f3d35" text-anchor="start">提交菜单</text><text x="1223" y="289" font-size="19" font-weight="500" fill="#cf4f3c" text-anchor="start">点餐者</text><text x="1223" y="335" font-size="17" font-weight="400" fill="#77786a" text-anchor="start">保存后等待大厨确认</text><path d="M1223 365H1501" fill="none" stroke="#e7e4d8" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="1223" y="390" font-size="15" font-weight="400" fill="#77786a" text-anchor="start">云端共享 · 由当前微信身份操作</text><rect x="72" y="460" width="332" height="228" rx="24" fill="#fffefa" stroke="#e7e4d8" stroke-width="1.5"/><circle cx="108" cy="499" r="19" fill="#728368" stroke="none" stroke-width="1"/><text x="108" y="506" font-size="19" font-weight="650" fill="#fff" text-anchor="middle">5</text><text x="140" y="507" font-size="25" font-weight="600" fill="#3f3d35" text-anchor="start">确认菜单</text><text x="98" y="569" font-size="19" font-weight="500" fill="#728368" text-anchor="start">大厨</text><text x="98" y="615" font-size="17" font-weight="400" fill="#77786a" text-anchor="start">核对菜品，再安排制作</text><path d="M98 645H376" fill="none" stroke="#e7e4d8" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="98" y="670" font-size="15" font-weight="400" fill="#77786a" text-anchor="start">云端共享 · 由当前微信身份操作</text><path d="M416 572H435M428 565L435 572L428 579" fill="none" stroke="#728368" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="447" y="460" width="332" height="228" rx="24" fill="#fffefa" stroke="#e7e4d8" stroke-width="1.5"/><circle cx="483" cy="499" r="19" fill="#728368" stroke="none" stroke-width="1"/><text x="483" y="506" font-size="19" font-weight="650" fill="#fff" text-anchor="middle">6</text><text x="515" y="507" font-size="25" font-weight="600" fill="#3f3d35" text-anchor="start">采购与制作</text><text x="473" y="569" font-size="19" font-weight="500" fill="#728368" text-anchor="start">大厨</text><text x="473" y="615" font-size="17" font-weight="400" fill="#77786a" text-anchor="start">合并买菜清单，逐道做好</text><path d="M473 645H751" fill="none" stroke="#e7e4d8" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="473" y="670" font-size="15" font-weight="400" fill="#77786a" text-anchor="start">云端共享 · 由当前微信身份操作</text><path d="M791 572H810M803 565L810 572L803 579" fill="none" stroke="#728368" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="822" y="460" width="332" height="228" rx="24" fill="#fffefa" stroke="#e7e4d8" stroke-width="1.5"/><circle cx="858" cy="499" r="19" fill="#cf4f3c" stroke="none" stroke-width="1"/><text x="858" y="506" font-size="19" font-weight="650" fill="#fff" text-anchor="middle">7</text><text x="890" y="507" font-size="25" font-weight="600" fill="#3f3d35" text-anchor="start">用餐与点评</text><text x="848" y="569" font-size="19" font-weight="500" fill="#cf4f3c" text-anchor="start">点餐者</text><text x="848" y="615" font-size="17" font-weight="400" fill="#77786a" text-anchor="start">记录实际结果和下次心愿</text><path d="M848 645H1126" fill="none" stroke="#e7e4d8" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="848" y="670" font-size="15" font-weight="400" fill="#77786a" text-anchor="start">云端共享 · 由当前微信身份操作</text><path d="M1166 572H1185M1178 565L1185 572L1178 579" fill="none" stroke="#728368" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="1197" y="460" width="332" height="228" rx="24" fill="#fffefa" stroke="#e7e4d8" stroke-width="1.5"/><circle cx="1233" cy="499" r="19" fill="#728368" stroke="none" stroke-width="1"/><text x="1233" y="506" font-size="19" font-weight="650" fill="#fff" text-anchor="middle">8</text><text x="1265" y="507" font-size="25" font-weight="600" fill="#3f3d35" text-anchor="start">查看历史</text><text x="1223" y="569" font-size="19" font-weight="500" fill="#728368" text-anchor="start">两位成员</text><text x="1223" y="615" font-size="17" font-weight="400" fill="#77786a" text-anchor="start">保留记录，复用到本期草稿</text><path d="M1223 645H1501" fill="none" stroke="#e7e4d8" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="1223" y="670" font-size="15" font-weight="400" fill="#77786a" text-anchor="start">云端共享 · 由当前微信身份操作</text><path d="M1524 292H1544V433H52V572H60M53 565L60 572L53 579" fill="none" stroke="#728368" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="72" y="768" width="1457" height="208" rx="24" fill="#e9eddf" stroke="none" stroke-width="1"/><text x="104" y="814" font-size="27" font-weight="650" fill="#728368" text-anchor="start">修改、确认与锁定规则</text><text x="104" y="859" font-size="22" font-weight="400" fill="#3f3d35" text-anchor="start">尚无菜品做好时：大厨可提议调整，点餐者修改后重新提交，原确认状态随之更新。</text><text x="104" y="901" font-size="22" font-weight="400" fill="#3f3d35" text-anchor="start">任意一道做好后：菜单锁定，不能直接改菜；制作记录与点评按对应菜单保留。</text><text x="104" y="943" font-size="21" font-weight="400" fill="#77786a" text-anchor="start">微信提醒：对方已主动订阅且权限有效时尝试发送，提醒故障不影响菜单保存。</text><text x="1528" y="1016" font-size="16" font-weight="400" fill="#77786a" text-anchor="end">流程示意 · 与生产微信环境、模板及两部手机联调结果分别验证</text></g></svg>
